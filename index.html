<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>검사법 게임 모드 퀴즈 템플릿</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #222b45, #050814);
      color: #f7f9fc;
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 1100px;
      background: rgba(8, 10, 26, 0.96);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(90deg, #141e30, #243b55);
    }
    header .title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1 span.badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffdd57;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    header p {
      font-size: 11px;
      color: #cbd5f5;
      opacity: 0.9;
    }
    .mode-toggle {
      display: inline-flex;
      padding: 2px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
    }
    .mode-toggle button {
      border: none;
      background: transparent;
      color: #cbd5ff;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      min-width: 70px;
      transition: 0.18s ease;
    }
    .mode-toggle button.active {
      background: #ff4f6a;
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 79, 106, 0.6);
    }
    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .left-pane {
      flex: 2.2;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
    }
    .right-pane {
      flex: 1.2;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: radial-gradient(circle at top left, #111827, #020617);
    }
    .panel {
      background: radial-gradient(circle at top left, #10152d, #050817);
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .panel-header h2 {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chip {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #9ca3ff;
    }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
    }
    select,
    button,
    input[type="text"] {
      font-family: inherit;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 255, 0.7);
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
    }
    select {
      padding-right: 26px;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #9ca3ff 50%),
        linear-gradient(135deg, #9ca3ff 50%, transparent 50%);
      background-position: calc(100% - 12px) 9px, calc(100% - 7px) 9px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    button {
      cursor: pointer;
      transition: 0.18s ease;
    }
    button.primary {
      background: linear-gradient(135deg, #ff4f6a, #ff914d);
      border: none;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 6px 16px rgba(248, 113, 113, 0.6);
    }
    button.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 9px 22px rgba(248, 113, 113, 0.8);
    }
    button.secondary {
      border-color: rgba(148, 163, 255, 0.8);
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
    }
    button.secondary:hover {
      background: rgba(30, 64, 175, 0.7);
    }
    button:disabled {
      opacity: 0.55;
      cursor: default;
      box-shadow: none;
      transform: none;
    }
    #questionMeta {
      font-size: 11px;
      color: #9ca3ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    #questionText {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    ul.options {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    .option-item {
      border-radius: 10px;
      padding: 7px 9px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 255, 0.5);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .option-item.correct {
      border-color: #4ade80;
      background: rgba(34, 197, 94, 0.12);
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.4);
    }
    .option-item.wrong {
      border-color: #fb7185;
      background: rgba(248, 113, 113, 0.12);
      box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.4);
    }
    .option-label {
      flex-shrink: 0;
      font-weight: 600;
      color: #c7d2fe;
      min-width: 16px;
    }
    .option-text {
      flex: 1;
    }
    .option-item input {
      margin-top: 3px;
      accent-color: #ff4f6a;
    }
    .answer-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    #recallInput {
      flex: 1;
    }
    #feedback {
      font-size: 12px;
      min-height: 18px;
    }
    #feedback.correct {
      color: #4ade80;
    }
    #feedback.wrong {
      color: #fb7185;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 4px;
    }
    .stat-card {
      background: radial-gradient(circle at top, #020617, #020617);
      border-radius: 10px;
      padding: 6px 8px;
      border: 1px solid rgba(148, 163, 255, 0.4);
      font-size: 11px;
    }
    .stat-label {
      opacity: 0.7;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 14px;
      font-weight: 700;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }
    .tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 255, 0.4);
      white-space: nowrap;
    }
    .wrong-list {
      max-height: 250px;
      overflow-y: auto;
      margin-top: 6px;
      padding-right: 4px;
    }
    .wrong-item {
      font-size: 11px;
      padding: 6px 6px;
      border-radius: 8px;
      margin-bottom: 4px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(248, 113, 113, 0.6);
    }
    .wrong-item strong {
      color: #fecaca;
    }
    .mini {
      font-size: 10px;
      opacity: 0.7;
    }
    @media (max-width: 820px) {
      .layout {
        flex-direction: column;
      }
      .left-pane {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .stats-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 480px) {
      header h1 {
        font-size: 16px;
      }
      .panel {
        padding: 10px 11px;
      }
      #questionText {
        font-size: 14px;
      }
      .option-item {
        font-size: 12px;
      }
      .stats-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-group">
        <h1>
          검사법 문제은행
          <span class="badge">게임 모드 템플릿</span>
        </h1>
        <p>문제 데이터는 직접 채워 넣는 버전</p>
      </div>
      <div class="mode-toggle">
        <button id="modeQuiz" class="active">객관식 퀴즈</button>
        <button id="modeRecall">암기 모드</button>
      </div>
    </header>
    <div class="layout">
      <div class="left-pane">
        <div class="panel">
          <div class="panel-header">
            <h2>🎮 문제 영역</h2>
            <span class="chip" id="categoryChip">검사법</span>
          </div>
          <div class="controls-row">
            <select id="categorySelect">
              <option value="ALL">검사법 (전체)</option>
            </select>
            <button class="secondary" id="shuffleBtn">섞어서 다시 시작</button>
          </div>
          <div id="questionMeta">
            <span id="qIndex">문제 0 / 0</span>
            <span id="qInfo">난이도 : 국시</span>
          </div>
          <div id="questionText">
            문제 데이터가 없습니다. questionBank에 문제를 추가해 주세요.
          </div>
          <ul class="options" id="optionsList"></ul>
          <div class="answer-row" id="recallRow" style="display:none;">
            <input
              type="text"
              id="recallInput"
              placeholder="키워드 입력 (정답 전체 말고 핵심어만 써도 인정)"
            />
            <button class="secondary" id="recallCheckBtn">체크</button>
          </div>
          <div class="controls-row">
            <button class="primary" id="checkBtn">정답 확인</button>
            <button class="secondary" id="nextBtn" disabled>다음 문제</button>
          </div>
          <div id="feedback"></div>
        </div>
      </div>
      <div class="right-pane">
        <div class="panel">
          <div class="panel-header">
            <h2>📊 진행 상황</h2>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">진행률</div>
              <div class="stat-value" id="statProgress">0%</div>
              <div class="mini" id="statCount">0 / 0문제</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">정답률</div>
              <div class="stat-value" id="statAccuracy">0%</div>
              <div class="mini" id="statScore">0점</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">연속 정답</div>
              <div class="stat-value" id="statCombo">0</div>
              <div class="mini" id="statBestCombo">최고 0연속</div>
            </div>
          </div>
          <div class="tag-row">
            <span class="tag">국가고시 대비</span>
            <span class="tag">검사법 전용</span>
            <span class="tag">오답 자동 저장</span>
            <span class="tag">암기모드 키워드 인식</span>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header">
            <h2>📚 오답 노트</h2>
          </div>
          <div class="mini">틀린 문제들이 자동으로 쌓입니다. (현재는 문제 없음)</div>
          <div class="wrong-list" id="wrongList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== 검사법 전용 설정 =====
    const DEFAULT_CATEGORY = "검사법";

    // 🔹 이 배열만 편집하면 됨! (문제 추가 영역)
    const rawQuestions = [
  // 1~10: 척추·신경계 검사
  {
    question:
      "Straight Leg Raise(SLR, 직거상 검사)가 양성일 때 가장 가능성이 높은 병변은 무엇인가?",
    options: [
      "넙다리곧은근(rectus femoris)의 단축",
      "좌골신경(sciatic nerve)의 신경긴장 또는 뿌리병증",
      "엉덩넙다리인대(iliofemoral ligament)의 단축",
      "천장관절(sacroiliac joint)의 불안정성",
      "대퇴골두 무혈성 괴사"
    ],
    answer: 2,
    explanation:
      "SLR(직거상 검사)는 좌골신경과 요추신경근의 긴장·압박 여부를 평가하는 대표적인 신경긴장 검사이다.",
    keywords: ["SLR", "직거상검사", "좌골신경", "요추신경근", "신경긴장"]
  },
  {
    question:
      "Bragard(브라가르드) 검사는 Straight Leg Raise(SLR) 검사에 어떤 요소를 추가하여 민감도를 높이는가?",
    options: [
      "엉덩관절 벌림",
      "엉덩관절 가쪽돌림",
      "발등굽힘(dorsiflexion)",
      "발바닥굽힘(plantarflexion)",
      "무릎 굽힘"
    ],
    answer: 3,
    explanation:
      "Bragard 검사는 SLR에서 통증이 유발된 각도에서 약간 낮추고 발등굽힘을 추가하여 좌골신경 긴장을 더욱 증가시키는 검사이다.",
    keywords: ["Bragard", "발등굽힘", "좌골신경", "신경긴장"]
  },
  {
    question:
      "Slump Test(슬럼프 검사)의 주 평가 대상은 무엇인가?",
    options: [
      "천장관절 불안정성",
      "경추 신경근병증",
      "요추 신경근 및 경막(neural tissue)의 긴장",
      "후관절(facet joint) 증후군",
      "엉덩관절 충돌 증후군"
    ],
    answer: 3,
    explanation:
      "Slump 검사는 앉은 자세에서 척추 굴곡, 경추 굴곡, 무릎 폄, 발등굽힘 등을 통해 신경계 전체의 긴장을 평가하는 검사이다.",
    keywords: ["Slump", "신경긴장", "요추신경근", "경막"]
  },
  {
    question:
      "Kemp Test(켐프 검사)가 가장 유용한 병변 평가는 무엇인가?",
    options: [
      "후관절(facet joint) 병변",
      "추간판탈출증(HNP)",
      "척수관 협착증",
      "천장관절 염좌",
      "요추 불안정성"
    ],
    answer: 1,
    explanation:
      "Kemp 검사는 요추를 폄·가쪽굽힘·가쪽돌림하여 후관절에 부담을 주는 검사로, 후관절 증후군 평가에 사용된다.",
    keywords: ["Kemp", "후관절", "facet", "요추"]
  },
  {
    question:
      "Spurling Test(스펄링 검사)의 양성 소견은 어떤 상태를 의미하는가?",
    options: [
      "경추 척수병증",
      "경추 신경근(radicular) 병변",
      "경추 불안정성",
      "경추 후관절염",
      "흉곽출구증후군"
    ],
    answer: 2,
    explanation:
      "Spurling 검사는 경추 신전·가쪽굽힘·축성압박을 통해 동측 팔로 방사되는 통증이 있으면 경추 신경근병증을 시사한다.",
    keywords: ["Spurlling", "경추신경근", "radiculopathy"]
  },
  {
    question:
      "Cervical Distraction Test(경추 견인 검사)에서 팔로 방사되는 통증이 감소할 경우 무엇을 시사하는가?",
    options: [
      "척수병증",
      "경추 신경근 압박",
      "흉곽출구증후군",
      "후관절 증후군",
      "근막통증증후군"
    ],
    answer: 2,
    explanation:
      "견인 시 방사통이 감소하면 신경근 압박이 줄어든 것으로 해석하여 경추 신경근병증을 시사한다.",
    keywords: ["cervical distraction", "경추견인", "신경근압박"]
  },
  {
    question:
      "Babinski(바빈스키) 반사 양성 소견(엄지발가락 폄, 나머지 발가락 벌어짐)은 어떤 병변을 의미하는가?",
    options: [
      "하위운동신경원(LMN) 병변",
      "상위운동신경원(UMN) 병변",
      "말초신경병증",
      "근육질환",
      "소뇌병변"
    ],
    answer: 2,
    explanation:
      "성인에서 바빈스키 양성은 상위운동신경원(UMN) 병변의 대표적인 징후이다.",
    keywords: ["Babinski", "바빈스키", "UMN", "상위운동신경원"]
  },
  {
    question:
      "Hoffman(호프만) 징후는 어느 부위의 상위운동신경원(UMN) 병변을 의심하게 하는가?",
    options: [
      "요추",
      "흉추",
      "경추",
      "말초신경총",
      "소뇌"
    ],
    answer: 3,
    explanation:
      "호프만 징후는 경추 수준의 UMN 병변을 의심하게 하는 상지의 병적 반사이다.",
    keywords: ["Hoffman", "호프만", "경추", "UMN"]
  },
  {
    question:
      "Romberg(롬버그) 검사는 주로 어떤 기능을 평가하는가?",
    options: [
      "소뇌 기능",
      "전정기관 기능만 단독으로",
      "고유수용성 감각과 평형",
      "시각기능",
      "피질척수로 기능"
    ],
    answer: 3,
    explanation:
      "Romberg 검사는 눈을 감았을 때 자세 유지능력을 평가하여 고유감각 및 전정·시각 의존도를 평가한다.",
    keywords: ["Romberg", "롬버그", "평형", "고유수용성"]
  },
  {
    question:
      "Clonus(간대성 경련) 검사는 어떤 신경계 이상과 가장 관련이 깊은가?",
    options: [
      "말초신경병증",
      "하위운동신경원 병변",

    // 🔹 여기서 id, category 자동 부여
    const questionBank = rawQuestions.map((q, idx) => ({
      id: idx + 1,
      category: DEFAULT_CATEGORY,
      ...q
    }));

    // ===== 상태 관리 =====
    let mode = "quiz"; // "quiz" or "recall"
    let currentIndex = 0;
    let filteredQuestions = [...questionBank];
    let score = 0;
    let correctCount = 0;
    let answeredCount = 0;
    let combo = 0;
    let bestCombo = 0;
    let wrongNote = [];

    const categorySelect = document.getElementById("categorySelect");
    const categoryChip = document.getElementById("categoryChip");
    const questionTextEl = document.getElementById("questionText");
    const optionsListEl = document.getElementById("optionsList");
    const qIndexEl = document.getElementById("qIndex");
    const feedbackEl = document.getElementById("feedback");
    const checkBtn = document.getElementById("checkBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const statProgressEl = document.getElementById("statProgress");
    const statCountEl = document.getElementById("statCount");
    const statAccuracyEl = document.getElementById("statAccuracy");
    const statScoreEl = document.getElementById("statScore");
    const statComboEl = document.getElementById("statCombo");
    const statBestComboEl = document.getElementById("statBestCombo");
    const wrongListEl = document.getElementById("wrongList");
    const modeQuizBtn = document.getElementById("modeQuiz");
    const modeRecallBtn = document.getElementById("modeRecall");
    const recallRow = document.getElementById("recallRow");
    const recallInput = document.getElementById("recallInput");
    const recallCheckBtn = document.getElementById("recallCheckBtn");

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function resetStats() {
      score = 0;
      correctCount = 0;
      answeredCount = 0;
      combo = 0;
      bestCombo = 0;
      wrongNote = [];
      updateStats();
      renderWrongList();
    }

    // 🔹 카테고리는 이제 소아물리 하나라서 아주 단순화
    function applyFilter() {
      filteredQuestions = [...questionBank];
      categoryChip.textContent = DEFAULT_CATEGORY;
      shuffleArray(filteredQuestions);
      currentIndex = 0;
      resetStats();
      renderQuestion();
    }

    function renderQuestion() {
      if (filteredQuestions.length === 0) {
        questionTextEl.textContent =
          "해당 파트에 등록된 문제가 없습니다. questionBank에 문제를 추가해 주세요.";
        optionsListEl.innerHTML = "";
        qIndexEl.textContent = "문제 0 / 0";
        feedbackEl.textContent = "";
        checkBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }
      checkBtn.disabled = false;
      const q = filteredQuestions[currentIndex];
      qIndexEl.textContent = `문제 ${currentIndex + 1} / ${filteredQuestions.length}`;
      questionTextEl.textContent = q.question;
      feedbackEl.textContent = "";
      feedbackEl.className = "";
      nextBtn.disabled = true;
      optionsListEl.innerHTML = "";

      if (mode === "quiz") {
        optionsListEl.style.display = "flex";
        recallRow.style.display = "none";
        q.options.forEach((opt, idx) => {
          const li = document.createElement("li");
          li.className = "option-item";
          li.dataset.index = idx + 1;
          li.innerHTML = `
            <span class="option-label">${idx + 1}.</span>
            <div class="option-text">
              <label>
                <input type="radio" name="option" value="${idx + 1}" />
                ${opt}
              </label>
            </div>
          `;
          li.addEventListener("click", () => {
            const radio = li.querySelector("input[type=radio]");
            radio.checked = true;
          });
          optionsListEl.appendChild(li);
        });
      } else {
        // 암기모드
        optionsListEl.style.display = "none";
        recallRow.style.display = "flex";
        recallInput.value = "";
      }
    }

    function getSelectedOption() {
      const radios = document.querySelectorAll("input[name='option']");
      for (const r of radios) {
        if (r.checked) return parseInt(r.value, 10);
      }
      return null;
    }

    function markOptions(correctIdx, chosenIdx) {
      const items = optionsListEl.querySelectorAll(".option-item");
      items.forEach((item) => {
        const idx = parseInt(item.dataset.index, 10);
        item.classList.remove("correct", "wrong");
        if (idx === correctIdx) {
          item.classList.add("correct");
        }
        if (chosenIdx && idx === chosenIdx && chosenIdx !== correctIdx) {
          item.classList.add("wrong");
        }
      });
    }

    function addWrongNote(question, chosen) {
      if (wrongNote.find((w) => w.id === question.id)) return;
      wrongNote.push({
        id: question.id,
        category: question.category,
        question: question.question,
        correct: question.options ? question.options[question.answer - 1] : "",
        explanation: question.explanation || "",
        chosen
      });
      renderWrongList();
    }

    function renderWrongList() {
      wrongListEl.innerHTML = "";
      if (wrongNote.length === 0) {
        wrongListEl.innerHTML =
          '<div class="mini" style="margin-top:4px;">오답이 아직 없습니다. 틀린 문제들이 여기 쌓입니다.</div>';
        return;
      }
      wrongNote.forEach((w, idx) => {
        const div = document.createElement("div");
        div.className = "wrong-item";
        div.innerHTML = `
          <div class="mini">#${idx + 1} · ${w.category}</div>
          <div><strong>Q.</strong> ${w.question}</div>
          <div><strong>정답:</strong> ${w.correct}</div>
          <div class="mini"><strong>해설:</strong> ${w.explanation}</div>
        `;
        wrongListEl.appendChild(div);
      });
    }

    function updateStats() {
      const total = filteredQuestions.length || 1;
      const progress = Math.round((currentIndex / total) * 100);
      statProgressEl.textContent = `${progress}%`;
      statCountEl.textContent = `${currentIndex} / ${total}문제`;
      const accuracy =
        answeredCount === 0
          ? 0
          : Math.round((correctCount / answeredCount) * 100);
      statAccuracyEl.textContent = `${accuracy}%`;
      statScoreEl.textContent = `${score}점`;
      statComboEl.textContent = combo.toString();
      statBestComboEl.textContent = `최고 ${bestCombo}연속`;
    }

    function checkQuizAnswer() {
      const q = filteredQuestions[currentIndex];
      const selected = getSelectedOption();
      if (!selected) {
        feedbackEl.textContent = "보기를 선택해줘!";
        feedbackEl.className = "wrong";
        return;
      }
      const isCorrect = selected === q.answer;
      answeredCount++;
      if (isCorrect) {
        feedbackEl.textContent = "정답! 👍";
        feedbackEl.className = "correct";
        correctCount++;
        combo++;
        score += 5;
        if (combo > bestCombo) bestCombo = combo;
      } else {
        feedbackEl.textContent = `오답 😢 정답은 ${q.answer}번: ${q.options[q.answer - 1]}`;
        feedbackEl.className = "wrong";
        score = Math.max(0, score - 1);
        addWrongNote(q, q.options[selected - 1]);
        combo = 0;
      }
      markOptions(q.answer, selected);
      nextBtn.disabled = false;
      updateStats();
    }

    function normalize(text) {
      return text.toString().trim().replace(/\s+/g, "").toLowerCase();
    }

    function checkRecallAnswer() {
      const q = filteredQuestions[currentIndex];
      const userInput = normalize(recallInput.value);
      if (!userInput) {
        feedbackEl.textContent = "키워드를 하나 이상 적어줘!";
        feedbackEl.className = "wrong";
        return;
      }
      let keyList = [];
      if (q.keywords && q.keywords.length > 0) {
        keyList = q.keywords;
      } else if (q.options && q.options[q.answer - 1]) {
        keyList = q.options[q.answer - 1]
          .split(/[\s·,()]+/)
          .filter((w) => w.length >= 2);
      }
      const hit = keyList.some((k) =>
        userInput.includes(normalize(k))
      );
      answeredCount++;
      if (hit) {
        feedbackEl.textContent = "키워드 인정! 정답 처리 ✅";
        feedbackEl.className = "correct";
        correctCount++;
        combo++;
        score += 5;
        if (combo > bestCombo) bestCombo = combo;
      } else {
        feedbackEl.textContent =
          "핵심 키워드가 부족해… 해설 보고 다시 외우자 😢";
        feedbackEl.className = "wrong";
        addWrongNote(q, userInput);
        combo = 0;
        score = Math.max(0, score - 1);
      }
      updateStats();
      nextBtn.disabled = false;
    }

    function gotoNext() {
      if (currentIndex < filteredQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
        updateStats();
      } else {
        feedbackEl.textContent =
          "모든 문제를 풀었어요! 🎉 문제를 더 추가하거나 다시 섞어서 복습해봐.";
        feedbackEl.className = "correct";
        nextBtn.disabled = true;
      }
    }

    checkBtn.addEventListener("click", () => {
      if (filteredQuestions.length === 0) {
        feedbackEl.textContent =
          "먼저 questionBank에 문제를 추가해야 합니다.";
        feedbackEl.className = "wrong";
        return;
      }
      if (mode === "quiz") {
        checkQuizAnswer();
      } else {
        checkRecallAnswer();
      }
    });

    nextBtn.addEventListener("click", () => {
      gotoNext();
    });

    shuffleBtn.addEventListener("click", () => {
      applyFilter();
    });

    categorySelect.addEventListener("change", () => {
      applyFilter();
    });

    modeQuizBtn.addEventListener("click", () => {
      mode = "quiz";
      modeQuizBtn.classList.add("active");
      modeRecallBtn.classList.remove("active");
      recallRow.style.display = "none";
      optionsListEl.style.display = "flex";
      renderQuestion();
    });

    modeRecallBtn.addEventListener("click", () => {
      mode = "recall";
      modeRecallBtn.classList.add("active");
      modeQuizBtn.classList.remove("active");
      renderQuestion();
    });

    recallCheckBtn.addEventListener("click", () => {
      if (filteredQuestions.length === 0) {
        feedbackEl.textContent =
          "먼저 questionBank에 문제를 추가해야 합니다.";
        feedbackEl.className = "wrong";
        return;
      }
      checkRecallAnswer();
    });

    if (recallInput) {
      recallInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          if (filteredQuestions.length === 0) {
            feedbackEl.textContent =
              "먼저 questionBank에 문제를 추가해야 합니다.";
            feedbackEl.className = "wrong";
            return;
          }
          checkRecallAnswer();
        }
      });
    }

    // 🔹 초기 로딩
    applyFilter();
    updateStats();
    renderWrongList();
  </script>
</body>
</html>
